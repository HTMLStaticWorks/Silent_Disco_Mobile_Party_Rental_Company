<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Silent Beats Mobile Disco</title>
  <meta name="description" content="Log in to your Silent Beats customer portal to manage equipment reservations, track package deliveries, view invoices, and customize party sound setups.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="auth-page-wrapper">
    <div style="position: absolute; top: 24px; right: 24px; display: flex; gap: 12px; z-index: 10;">
      <button class="icon-btn rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL">⇆</button>
      <button class="icon-btn theme-toggle" aria-label="Toggle Theme" title="Toggle Dark/Light Mode"><i data-lucide="sun"></i></button>
    </div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 16px;">
          <div class="logo-glow" style="width: 44px; height: 44px;">
            <i data-lucide="music"></i>
          </div>
          Neon<span>Vibes</span>
        </a>
        <h1>Welcome Back</h1>
        <p style="font-size: 0.9rem;">Access your party reservations and rental dashboard</p>
      </div>

      <form id="loginForm" data-validate="true" data-success-msg="Login successful! Redirecting to Home... 🎧">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" required placeholder="name@example.com">
          <span class="form-error-msg">Please enter a valid email address</span>
        </div>

        <div class="form-group" style="margin-bottom: 12px;">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" class="form-input" required minlength="8" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="password-toggle-btn" aria-label="Show password" title="Show password" aria-pressed="false">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <span class="form-error-msg">Password must be at least 8 characters</span>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <label class="form-checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" style="font-size: 0.85rem; color: var(--secondary); font-weight: var(--weight-bold-inline);" onclick="alert('Password reset link sent to your email!'); return false;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Login
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="oauth-buttons-group">
        <button class="btn-oauth" onclick="alert('Authenticating with Google...'); window.location.href='index.html';">
          <svg class="oauth-icon-svg" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.4 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
            <path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.1-2 .4-2.7L1.6 6.4C.6 8.3 0 10.6 0 13s.6 4.7 1.6 6.6l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.4-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/>
          </svg>
          Continue with Google
        </button>

        <button class="btn-oauth" onclick="alert('Authenticating with Apple...'); window.location.href='index.html';">
          <svg class="oauth-icon-svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.62-.75 1.04-1.8 0.92-2.84-.9.04-1.98.6-2.62 1.34-.57.65-1.06 1.71-.93 2.72 1.01.08 2.02-.48 2.63-1.22z"/>
          </svg>
          Continue with Apple
        </button>
      </div>

      <div class="auth-switch-link">
        Don't have an account yet? <a href="register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
