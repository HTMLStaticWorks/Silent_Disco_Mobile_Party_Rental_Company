<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="#090714"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" opacity="0.2"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#bgGrad)" stroke-width="2"/>
  
  <!-- Glowing Headphone Icon -->
  <g filter="url(#glow)" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(4, 4)">
    <!-- Headband -->
    <path d="M12 28v-6a16 16 0 0 1 32 0v6"/>
    <!-- Left Earcup -->
    <rect x="8" y="26" width="8" height="14" rx="4" fill="#8b5cf6" stroke="#ffffff"/>
    <!-- Right Earcup -->
    <rect x="40" y="26" width="8" height="14" rx="4" fill="#06b6d4" stroke="#ffffff"/>
    <!-- Audio Wave / Sparkle -->
    <circle cx="28" cy="20" r="1.5" fill="#ec4899" stroke="none"/>
  </g>
</svg>
